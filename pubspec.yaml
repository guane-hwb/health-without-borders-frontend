name: health_without_borders_frontend
description: "Health Without Borders — Mobile app for migrant health records."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Network ──
  http: ^1.6.0
  connectivity_plus: ^6.1.4

  # ── Config ──
  flutter_dotenv: ^6.0.0

  # ── Security ──
  flutter_secure_storage: ^10.0.0

  # ── NFC ──
  nfc_manager: ^3.5.0

  # ── Local Database (offline-first) ──
  sqflite: ^2.4.2
  path: ^1.9.1

  # ── Utilities ──
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.production
    - assets/images/
