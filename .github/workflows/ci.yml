# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  quality-gates:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"

      - name: Install dependencies
        run: flutter pub get

      - name: Create env files for CI
        run: |
          echo "API_BASE_URL=http://localhost:8000" > .env
          echo "API_BASE_URL=http://localhost:8000" > .env.production

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verificar que patient_profile_screen.dart no supere 900 líneas
        run: |
          MAX_LINES=900
          FILE="lib/src/features/nfc/presentation/profile/patient_profile_screen.dart"
          LINES=$(wc -l < "$FILE")
          echo "Líneas en $FILE: $LINES"
          if [ "$LINES" -gt "$MAX_LINES" ]; then
            echo "Error: $FILE supera las $MAX_LINES líneas ($LINES líneas). Mantén la arquitectura modular."
            exit 1
          fi

      - name: Test with coverage
        run: flutter test --coverage

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Build Web
        run: flutter build web --release

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          skip_validation: true