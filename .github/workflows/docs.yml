name: Publish Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fb717ef62dd823a101b7a2d4805c868 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.42 \
            pymdown-extensions==10.12

      - name: Deploy MkDocs
        if: github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force

      - name: Build MkDocs (dry-run on non-main)
        if: github.ref != 'refs/heads/main'
        run: mkdocs build --strict