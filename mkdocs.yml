site_name: Health Without Borders — Frontend
site_description: Documentación del cliente multiplataforma (Flutter) para la iniciativa Health Without Borders.
site_url: https://guanes.github.io/health-without-borders-frontend/
repo_url: https://github.com/guanes/health-without-borders-frontend
repo_name: guanes/health-without-borders-frontend
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Setup: index.md
  - Development:
    - development/index.md
    - Local Setup: development/setup.md
    - QA and PR Flow: development/qa-plan.md
    - Figma to Flutter: development/figma-to-flutter.md
  - Architecture:
    - architecture/index.md
    - Project Structure: architecture/project-structure.md
    - Modules and Features: architecture/features.md
    - Offline-First and Synchronization: architecture/offline-sync.md
  - API and Domain:
    - api/index.md
    - Domain Models: api/domain-models.md
    - HTTP Client: api/api-client.md
    - Auth: api/auth.md
  - Testing: testing.md