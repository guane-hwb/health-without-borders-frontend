codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%

ignore:
  - "lib/**/*.g.dart"
  - "lib/**/*.freezed.dart"
  - "lib/**/*.mocks.dart"
  - "test/**"

comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: true